
<!DOCTYPE html>
<html>
<head>
    <title>DevOps Monitoring Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #0b1120;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
            padding: 35px;
        }
        h1 { color: #38bdf8; }
        .subtitle { color: #94a3b8; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(210px,1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #172033;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #29364d;
        }
        .card h3 { color: #94a3b8; }
        .value { font-size: 32px; font-weight: bold; }
        .online { color: #4ade80; }
        .footer { color: #64748b; margin-top: 35px; }
    </style>
</head>
<body>
    <h1>DevOps Monitoring Dashboard</h1>
    <p class="subtitle">Real-Time Application & System Monitoring</p>

    <div class="grid">
        <div class="card">
            <h3>Application Status</h3>
            <div class="value online" id="status">Loading...</div>
        </div>
        <div class="card">
            <h3>CPU Usage</h3>
            <div class="value" id="cpu">--%</div>
        </div>
        <div class="card">
            <h3>Memory Usage</h3>
            <div class="value" id="memory">--%</div>
        </div>
        <div class="card">
            <h3>Application Uptime</h3>
            <div class="value" id="uptime">--</div>
        </div>
        <div class="card">
            <h3>HTTP Requests</h3>
            <div class="value" id="requests">0</div>
        </div>
    </div>

    <p class="footer">DevOps Automation & Monitoring System | Auto refresh: 3 seconds</p>

    <script>
        async function updateDashboard() {
            try {
                const response = await fetch('/api/stats');
                if (!response.ok) throw new Error("API error");
                const data = await response.json();

                document.getElementById('status').textContent = data.status;
                document.getElementById('cpu').textContent = data.cpu + '%';
                document.getElementById('memory').textContent = data.memory + '%';
                document.getElementById('uptime').textContent = data.uptime + ' sec';
                document.getElementById('requests').textContent = data.requests;
            } catch (error) {
                document.getElementById('status').textContent = 'Offline';
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 3000);
    </script>
</body>
</html>
